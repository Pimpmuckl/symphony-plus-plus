name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            target: ci-static
            partition: ""
            partitions: ""
          - name: test 1/12
            target: ci-test
            partition: 1
            partitions: 12
          - name: test 2/12
            target: ci-test
            partition: 2
            partitions: 12
          - name: test 3/12
            target: ci-test
            partition: 3
            partitions: 12
          - name: test 4/12
            target: ci-test
            partition: 4
            partitions: 12
          - name: test 5/12
            target: ci-test
            partition: 5
            partitions: 12
          - name: test 6/12
            target: ci-test
            partition: 6
            partitions: 12
          - name: test 7/12
            target: ci-test
            partition: 7
            partitions: 12
          - name: test 8/12
            target: ci-test
            partition: 8
            partitions: 12
          - name: test 9/12
            target: ci-test
            partition: 9
            partitions: 12
          - name: test 10/12
            target: ci-test
            partition: 10
            partitions: 12
          - name: test 11/12
            target: ci-test
            partition: 11
            partitions: 12
          - name: test 12/12
            target: ci-test
            partition: 12
            partitions: 12
          - name: slow test 1/8
            target: ci-slow
            partition: 1
            partitions: 8
          - name: slow test 2/8
            target: ci-slow
            partition: 2
            partitions: 8
          - name: slow test 3/8
            target: ci-slow
            partition: 3
            partitions: 8
          - name: slow test 4/8
            target: ci-slow
            partition: 4
            partitions: 8
          - name: slow test 5/8
            target: ci-slow
            partition: 5
            partitions: 8
          - name: slow test 6/8
            target: ci-slow
            partition: 6
            partitions: 8
          - name: slow test 7/8
            target: ci-slow
            partition: 7
            partitions: 8
          - name: slow test 8/8
            target: ci-slow
            partition: 8
            partitions: 8
          - name: dialyzer
            target: ci-dialyzer
            partition: ""
            partitions: ""
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-

      - name: Verify ${{ matrix.name }}
        run: make ${{ matrix.target }}
        env:
          FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
          SLOW_TEST_PARTITIONS: ${{ matrix.partitions }}
          MIX_TEST_PARTITION: ${{ matrix.partition }}

  make-all:
    runs-on: ubuntu-latest
    needs:
      - gates
    if: ${{ always() }}
    steps:
      - name: Verify split gates
        run: |
          if [ "${{ needs.gates.result }}" != "success" ]; then
            echo "split gate result: ${{ needs.gates.result }}"
            exit 1
          fi
          echo "make-all split gates passed"
