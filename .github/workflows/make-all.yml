name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-

      - name: Verify static
        run: make ci-static

  test-groups:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test 1-3/9
            target: ci-test-partition
            label: test
            partitions: "9"
            gate_prefix: fast
            partition_1: "1"
            partition_2: "2"
            partition_3: "3"
            partition_4: ""
          - name: test 4-6/9
            target: ci-test-partition
            label: test
            partitions: "9"
            gate_prefix: fast
            partition_1: "4"
            partition_2: "5"
            partition_3: "6"
            partition_4: ""
          - name: test 7-9/9
            target: ci-test-partition
            label: test
            partitions: "9"
            gate_prefix: fast
            partition_1: "7"
            partition_2: "8"
            partition_3: "9"
            partition_4: ""
          - name: slow test 1-4/8
            target: ci-slow-partition
            label: slow test
            partitions: "8"
            gate_prefix: slow
            partition_1: "1"
            partition_2: "2"
            partition_3: "3"
            partition_4: "4"
          - name: slow test 5-8/8
            target: ci-slow-partition
            label: slow test
            partitions: "8"
            gate_prefix: slow
            partition_1: "5"
            partition_2: "6"
            partition_3: "7"
            partition_4: "8"
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-

      - name: Prepare ${{ matrix.label }}s
        run: make ci-test-prepare
        env:
          GATE_RUN_ID: ${{ matrix.gate_prefix }}-${{ matrix.partition_1 }}-prepare

      - parallel:
          - name: ${{ matrix.label }} ${{ matrix.partition_1 }}/${{ matrix.partitions }}
            run: make ${{ matrix.target }}
            env:
              FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
              SLOW_TEST_PARTITIONS: ${{ matrix.partitions }}
              MIX_TEST_PARTITION: ${{ matrix.partition_1 }}
              GATE_RUN_ID: ${{ matrix.gate_prefix }}-${{ matrix.partition_1 }}

          - name: ${{ matrix.label }} ${{ matrix.partition_2 }}/${{ matrix.partitions }}
            run: make ${{ matrix.target }}
            env:
              FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
              SLOW_TEST_PARTITIONS: ${{ matrix.partitions }}
              MIX_TEST_PARTITION: ${{ matrix.partition_2 }}
              GATE_RUN_ID: ${{ matrix.gate_prefix }}-${{ matrix.partition_2 }}

          - name: ${{ matrix.label }} ${{ matrix.partition_3 }}/${{ matrix.partitions }}
            run: make ${{ matrix.target }}
            env:
              FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
              SLOW_TEST_PARTITIONS: ${{ matrix.partitions }}
              MIX_TEST_PARTITION: ${{ matrix.partition_3 }}
              GATE_RUN_ID: ${{ matrix.gate_prefix }}-${{ matrix.partition_3 }}

          - name: ${{ matrix.label }} ${{ matrix.partition_4 }}/${{ matrix.partitions }}
            if: ${{ matrix.partition_4 != '' }}
            run: make ${{ matrix.target }}
            env:
              FAST_TEST_PARTITIONS: ${{ matrix.partitions }}
              SLOW_TEST_PARTITIONS: ${{ matrix.partitions }}
              MIX_TEST_PARTITION: ${{ matrix.partition_4 }}
              GATE_RUN_ID: ${{ matrix.gate_prefix }}-${{ matrix.partition_4 }}

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-mix-${{ hashFiles('elixir/mise.toml') }}-

      - name: Cache dialyzer PLTs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            elixir/_build/dialyzer
            elixir/_build/*/dialyxir_*.plt
            elixir/_build/*/dialyxir_*.plt.hash
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ hashFiles('elixir/mise.toml') }}-${{ hashFiles('elixir/mix.exs') }}-
            ${{ runner.os }}-dialyzer-${{ hashFiles('elixir/mise.toml') }}-

      - name: Verify dialyzer
        run: make ci-dialyzer

  make-all:
    runs-on: ubuntu-latest
    needs:
      - static
      - test-groups
      - dialyzer
    if: ${{ always() }}
    steps:
      - name: Verify split gates
        run: |
          if [ "${{ needs.static.result }}" != "success" ] ||
             [ "${{ needs['test-groups'].result }}" != "success" ] ||
             [ "${{ needs.dialyzer.result }}" != "success" ]; then
            echo "static: ${{ needs.static.result }}"
            echo "test-groups: ${{ needs['test-groups'].result }}"
            echo "dialyzer: ${{ needs.dialyzer.result }}"
            exit 1
          fi
          echo "make-all split gates passed"
