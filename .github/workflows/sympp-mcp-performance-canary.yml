name: Symphony++ MCP performance canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  performance-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache Elixir dependencies for the isolated gate
        working-directory: elixir
        run: mix deps.get --check-locked

      - name: Run the real 100-client gate
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP "sympp-mcp-performance-gate"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $stdout = Join-Path $outputDirectory "stdout.toon"
          $stderr = Join-Path $outputDirectory "stderr.log"
          $env:SYMPP_PERFORMANCE_PROGRESS_FILE = Join-Path $outputDirectory "exact-command-progress.log"
          New-Item -ItemType File -Path $env:SYMPP_PERFORMANCE_PROGRESS_FILE -Force | Out-Null

          $env:SYMPP_REAL_MIX = (& mise -C elixir which mix).Trim()
          if (-not [IO.Path]::GetExtension($env:SYMPP_REAL_MIX)) { $env:SYMPP_REAL_MIX += '.bat' }
          $mixWrapper = Join-Path $env:RUNNER_TEMP 'sympp-mix.ps1'
          Set-Content -LiteralPath $mixWrapper -Value '& $env:SYMPP_REAL_MIX @args; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
          $env:SYMPP_MIX = $mixWrapper
          $gateProcess = Start-Process `
            -FilePath (Get-Command pwsh -ErrorAction Stop).Source `
            -ArgumentList '-NoProfile', '-File', 'scripts/benchmarks/sympp-mcp/run-performance-gate.ps1' `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden `
            -PassThru

          $timeoutMilliseconds = [int]([TimeSpan]::FromMinutes(120).TotalMilliseconds)
          if ($gateProcess.WaitForExit($timeoutMilliseconds)) {
            $gateExitCode = $gateProcess.ExitCode
          } else {
            $gateProcess.Kill($true)
            $gateProcess.WaitForExit()
            Add-Content -LiteralPath $stderr -Value 'Performance gate exceeded the 120-minute process timeout.'
            $gateExitCode = 124
          }

          [Console]::Out.Write((Get-Content -LiteralPath $stdout -Raw))
          [Console]::Error.Write((Get-Content -LiteralPath $stderr -Raw))
          exit $gateExitCode

      - name: Upload gate stdout
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sympp-mcp-performance-stdout-${{ github.run_attempt }}
          path: ${{ runner.temp }}\sympp-mcp-performance-gate\stdout.toon

      - name: Upload gate stderr
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sympp-mcp-performance-stderr-${{ github.run_attempt }}
          path: ${{ runner.temp }}\sympp-mcp-performance-gate\stderr.log

      - name: Upload exact-command progress
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sympp-mcp-performance-exact-progress-${{ github.run_attempt }}
          path: ${{ runner.temp }}\sympp-mcp-performance-gate\exact-command-progress.log
